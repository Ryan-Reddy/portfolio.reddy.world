# "Send to site" on the image desk: Ryan's desk changes as one pull request with a preview.
# - Started by the desk's button through reddy.world's /api/desk-to-site (functions/desk.js in
#   Ryan-Reddy/reddy.world), by hand here ("Run workflow"), and every night.
# - Three jobs, so no job has both installed packages and a credential:
#   1. fetch (GitHub's OIDC token, no packages): the desk from Ryan's account through reddy.world's
#      /api/desk-state, and the originals of the published articles' pictures through /api/desk-upload;
#   2. build (no token, no secrets): web copies of those pictures (scripts/desk-pictures.mjs), then the
#      desk into the archive data and the articles collection (scripts/import-image-keywords.mjs);
#   3. push (DESK_TOKEN, no packages): the changes to a desk/ branch with one open pull request, "Your desk
#      changes", and a comment per push with what changed. Ryan's token makes the PR get its preview from
#      preview.yml like any other; it goes live only when Ryan merges it.
# - Nothing changed: nothing happens. The desk back to what the site has: the open desk PR is closed.
# - The nightly run waits quietly until DESK_TOKEN exists and reddy.world answers; a send by hand says why.
name: Desk to site

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

concurrency:
  group: desk-to-site
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      go: ${{ steps.desk.outputs.go }}
    steps:
      - name: Ready to send?
        id: ready
        shell: bash
        env:
          DESK_TOKEN: ${{ secrets.DESK_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -n "$DESK_TOKEN" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          msg="The repository secret DESK_TOKEN is missing: see the steps in Ryan-Reddy/reddy.world#205"
          if [ "$EVENT" = schedule ]; then echo "::notice::$msg"; else echo "::error::$msg"; exit 1; fi

      - name: Fetch the desk and its pictures from Ryan's account
        id: desk
        if: steps.ready.outputs.go == 'true'
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          mkdir -p desk/originals
          oidc=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=reddy.world-desk" | jq -r .value)
          code=$(curl -sS -o desk/desk.json -w '%{http_code}' -H "Authorization: Bearer $oidc" https://reddy.world/api/desk-state)
          if [ "$code" != 200 ]; then
            msg="reddy.world/api/desk-state answered $code (404: no desk saved in the account yet, or the function is not deployed)"
            if [ "$EVENT" = schedule ] && [ "$code" = 404 ]; then echo "::notice::$msg"; exit 0; fi
            echo "::error::$msg"; exit 1
          fi
          # the originals of the pictures the published articles show (desk-uploads/<id>-<name>)
          jq -r '.articles // {} | to_entries[] | .value | select(.status == "ready" and (.deleted | not)) | .pictures // {} | to_entries[] | select(.value.removed | not) | .value.path' desk/desk.json | sort -u | while read -r path; do
            curl -sSf -H "Authorization: Bearer $oidc" --get --data-urlencode "path=$path" https://reddy.world/api/desk-upload -o "desk/originals/$(basename "$path")" || echo "::warning::picture not fetched: $path"
          done
          echo "go=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.desk.outputs.go == 'true'
        with:
          name: desk
          path: desk/
          retention-days: 1

  build:
    needs: fetch
    if: needs.fetch.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # packages for the picture copies (sharp); this job holds no token and no secret
      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: desk
          path: ${{ runner.temp }}/desk

      # bash here means -eo pipefail: a failing step stops the run instead of hiding behind tee
      - name: Pictures, then the desk into the archive data and the articles
        shell: bash
        run: |
          D="$RUNNER_TEMP/desk"
          node scripts/desk-pictures.mjs "$D/desk.json" "$D/originals" "$D/pictures.json" 2>&1 | tee "$RUNNER_TEMP/report.txt"
          node scripts/import-image-keywords.mjs "$D/desk.json" --pictures "$D/pictures.json" 2>&1 | tee -a "$RUNNER_TEMP/report.txt"

      - name: The changes, as a patch for the push job
        id: changes
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/report.txt" "$RUNNER_TEMP/out/report.txt"
          # a folder that is neither there nor in git (no article has pictures yet) would stop `git add`
          for p in src/data src/content/articles public/images/articles; do
            if [ -e "$p" ] || [ -n "$(git ls-files -- "$p")" ]; then git add -A -- "$p"; fi
          done
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else git diff --cached --binary > "$RUNNER_TEMP/out/changes.patch"; echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: changes
          path: ${{ runner.temp }}/out/
          retention-days: 1

  push:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: changes
          path: ${{ runner.temp }}/out

      # only the workflow's own pull request counts: in this repository (not a fork), with its title, by Ryan's token
      - name: The open desk pull request
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --state open --json number,headRefName,isCrossRepository,title,author --jq '
            [.[] | select(.isCrossRepository == false and .title == "Your desk changes" and (.headRefName | startswith("desk/")) and .author.login == "Ryan-Reddy")][0]
            | if . then "number=\(.number)\nbranch=\(.headRefName)" else "number=\nbranch=" end' >> "$GITHUB_OUTPUT"

      - name: What changed
        id: changed
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DESK_TOKEN }}
          NUMBER: ${{ steps.pr.outputs.number }}
          OPEN: ${{ steps.pr.outputs.branch }}
          CHANGED: ${{ needs.build.outputs.changed }}
        run: |
          if [ "$CHANGED" != true ]; then
            echo "Nothing on the desk differs from the site."
            # the desk is back to what the site has: merging the open desk PR would publish what Ryan took back
            if [ -n "$NUMBER" ]; then gh pr close "$NUMBER" --delete-branch --comment "Closed by Send to site: the desk now matches the site, so there is nothing left to send."; fi
            exit 0
          fi
          git apply --index --binary "$RUNNER_TEMP/out/changes.patch"
          if [ -n "$OPEN" ]; then
            git fetch -q origin "$OPEN"
            if git diff --cached --quiet "origin/$OPEN" -- src/data src/content/articles public/images/articles; then echo "The open pull request already has these changes."; exit 0; fi
            # a commit made on the desk PR by hand is never thrown away
            others=$(git log "origin/main..origin/$OPEN" --format='%ae' | grep -v '^41898341+github-actions\[bot\]@users.noreply.github.com$' || true)
            if [ -n "$others" ]; then
              gh pr comment "$NUMBER" --body "Send to site has new desk changes, but this pull request has commits that did not come from the desk, so I left it as it is. Merge or close it, then send again."
              echo "::error::The open desk pull request has commits from elsewhere; it was not overwritten"
              exit 1
            fi
          fi
          echo "yes=true" >> "$GITHUB_OUTPUT"

      - name: Push, and open or update the pull request
        if: steps.changed.outputs.yes == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DESK_TOKEN }}
          NUMBER: ${{ steps.pr.outputs.number }}
          OPEN: ${{ steps.pr.outputs.branch }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          branch="${OPEN:-desk/to-site-$(date -u +%Y%m%d-%H%M)}"
          report="$RUNNER_TEMP/out/report.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898341+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -q -m "Desk changes, $(date -u '+%Y-%m-%d %H:%M') UTC" -m "$(head -c 20000 "$report")"
          # Ryan's token for this push only: the pull request then gets its preview from preview.yml
          git push --force -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$branch"
          # a comment holds at most 65,536 characters: a long report is cut, the run log has all of it
          {
            echo "Sent from the image desk: [run]($RUN)"
            echo
            echo '```'
            head -c 60000 "$report"
            if [ "$(wc -c < "$report")" -gt 60000 ]; then echo; echo '… the rest is in the run log'; fi
            echo '```'
          } > "$RUNNER_TEMP/comment.md"
          if [ -z "$NUMBER" ]; then
            cat > "$RUNNER_TEMP/body.md" <<'EOF'
          Your changes from the image desk (https://reddy.world/private/portfolio/), sent with "Send to site".

          ## Done when
          - [ ] The preview (the bot's link below) shows the changes on the project pages, the articles and the wall feed
          - [ ] Ryan merges this pull request: that puts them live

          ## How to check
          1. Open the preview link the bot posts below.
          2. Open a project or an article you changed (the comments list them): the words and pictures are yours.
          3. The wall reads `rss.xml` on the preview: your summaries and new articles are in it.

          Sending again before merging updates this pull request; each send adds a comment with what changed.
          EOF
            url=$(gh pr create --base main --head "$branch" --title "Your desk changes" --body-file "$RUNNER_TEMP/body.md")
            NUMBER="${url##*/}"
          fi
          gh pr comment "$NUMBER" --body-file "$RUNNER_TEMP/comment.md"
